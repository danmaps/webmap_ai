name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: TypeScript (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Run offline active-projects proof
        run: node examples/active-projects/run.mjs > active-projects-proof.md
      - uses: actions/upload-artifact@v4
        with:
          name: active-projects-proof
          path: active-projects-proof.md
